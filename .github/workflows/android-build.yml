name: Android Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate required secrets are set
        run: |
          for v in GOOGLE_SERVICES_JSON_BASE64 KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::Secret $v is not set"; exit 1; fi
          done
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      # WARNING: do not add debugging commands here (e.g. `cat google-services.json`,
      # `keytool -list -v`) that would print the decoded file contents to the log.
      # GitHub's secret masking only redacts literal reprints of the original secret
      # value, not transformed/decoded output, so doing so would leak real key
      # material into the Actions log.
      - name: Decode google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 -d > android/app/google-services.json

      - name: Decode signing keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/cardio-surfer-upload.jks

      - name: Sync Capacitor
        run: npx cap sync android

      # Defensive: gradlew's executable bit is easy to lose when the android/
      # project is generated/committed from Windows (NTFS has no Unix execute
      # bit), which caused a real "Permission denied" CI failure once already.
      - name: Ensure gradlew is executable
        run: chmod +x android/gradlew

      # Diagnostic: confirm which play-services-auth (and related Google
      # Sign-In library) version is actually being compiled in, since
      # rgcfaIncludeGoogle previously defaulted to false and the library
      # was only ever pulled in transitively via firebase-auth at an
      # unpinned version. Safe to log — no secret material involved.
      - name: Print resolved Google Sign-In dependency versions
        working-directory: android
        run: ./gradlew :app:dependencies --configuration releaseRuntimeClasspath | grep -E "play-services-auth|androidx.credentials|libraries.identity.googleid|firebase-auth" || true

      - name: Build signed AAB
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: cardio-surfer-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
